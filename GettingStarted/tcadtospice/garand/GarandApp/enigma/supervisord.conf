[supervisord]
logfile = enigma/db/../supervisor.log
nodaemon = False

[supervisorctl]
serverurl = http://127.0.0.1:22007

[inet_http_server]
port = 127.0.0.1:22007

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:mongod]
command = /usr/synopsys/sentaurus/W-2024.09/bin/../tcad/current/linux64/bin/mongod --dbpath enigma/db --directoryperdb --port 27092 --nounixsocket --pidfilepath /usr/synopsys/sentaurus/W-2024.09/tcad/W-2024.09/Applications_Library/GettingStarted/tcadtospice/garand/GarandApp/enigma/db/mongod.pid --bind_ip_all --setParameter honorSystemUmask=true --setParameter diagnosticDataCollectionEnabled=false --auth 
stdout_logfile = enigma/db/../mongod_stdout.log
stderr_logfile = enigma/db/../mongod_stderr.log
autostart = True
stopsignal = INT
stopwaitsecs = 10
stopasgroup = True
environment = TCAD_ENABLE_MONGODB_42=1

